[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-intelligence-engine"
version = "0.1.0"
description = "Advanced NYC Taxi Demand Analytics and Forecasting Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "S Mohammed Sahil"}
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.35",
    "plotly>=5.20",
    "openpyxl>=3.1",
    "pytest>=8.0",
    "jupyter>=1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]